<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PT Analytics Next</title><link rel="icon" type="image/svg+xml" href="logo.svg"><link rel="stylesheet" href="style.css"><script defer src="report.js"></script><script defer src="app.js"></script></head>
<body>
<aside id="rail" aria-label="导航"></aside>
<main><header><div><h1>Profit Taker Analytics <small>Next</small></h1><p id="subtitle">你好！</p></div><div id="toolbar" class="toolbar"></div></header>
<section id="content" aria-live="polite"></section></main>
<footer><div id="status"><i></i> 正在连接核心…</div><span id="progress"></span><span id="version">v0.1.8</span><button id="author-link" type="button" data-action="github:author" title="访问 Aameow 的 GitHub">By. Aameow</button></footer>
<dialog id="edit"><form id="edit-form"><h2 id="dialog-title">修改名称</h2><p id="dialog-description"></p><input id="dialog-input" maxlength="100"><div class="dialog-actions"><button type="button" id="dialog-cancel">取消</button><button class="primary" type="submit">确认</button></div></form></dialog>
<dialog id="star-prompt" aria-labelledby="star-title"><div class="star-hero"><img src="logo.svg" alt="" width="64" height="64"><h2 id="star-title">喜欢 PT Analytics Next 吗？</h2></div><p>感谢你使用 PT Analytics Next！如果它对你的大蜘蛛竞速有所帮助，欢迎到 GitHub 给项目点一颗 Star，支持我们继续开发。</p><div class="dialog-actions"><button type="button" id="star-dismiss">不再提示</button><button class="primary" type="button" id="star-visit">前往 GitHub 点 Star</button></div></dialog>
<div id="toast" role="status"></div></body></html>
