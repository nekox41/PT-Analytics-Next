name: Windows build & release
on:
  push:
    branches: [master]
    paths:
      - 'src-tauri/**'
      - 'ui/**'
      - 'package.json'
      - 'app-icon.svg'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install CLI and generate app icons
        run: |
          npm install
          npm run icons
          npm run check
      - name: Rust regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --release
      - name: Build Windows x64 app and NSIS installer
        run: npm run build -- --bundles nsis
      - name: Collect binaries and corresponding source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $bin = Get-ChildItem src-tauri/target/release -Filter '*.exe' -File | Where-Object { $_.Name -in @('pt-analytics-next.exe','PT Analytics Next.exe') } | Select-Object -First 1
          if (-not $bin) { throw 'Application executable not found' }
          Copy-Item $bin.FullName dist/PT-Analytics-Next_0.1.5_x64_portable.exe
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer not found' }
          Copy-Item $installer.FullName dist/PT-Analytics-Next_0.1.5_x64_setup.exe
          git archive --format=zip --output=dist/PT-Analytics-Next_0.1.5_source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          7z a dist/PT-Analytics-Next_0.1.5_source.zip src-tauri/Cargo.lock package-lock.json src-tauri/icons
          if ($LASTEXITCODE -ne 0) { throw 'Source archive completion failed' }
          Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PT-Analytics-Next-windows-x64
          path: dist/*
          if-no-files-found: error
      - name: Publish v0.1.5
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view v0.1.5 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host 'v0.1.5 already exists; not replacing release'; exit 0 }
          gh release create v0.1.5 dist/PT-Analytics-Next_0.1.5_x64_portable.exe dist/PT-Analytics-Next_0.1.5_x64_setup.exe dist/PT-Analytics-Next_0.1.5_source.zip dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title 'PT Analytics Next v0.1.5' --notes-file RELEASE_NOTES.md --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
