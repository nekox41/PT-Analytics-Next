name: Windows build (manual)
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new Release after successful build
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build and regression tests
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Package corresponding source
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          git ls-tree -r -z --name-only HEAD > .tracked-manifest
          python scripts/package_source.py . .tracked-manifest "dist/PT-Analytics-Next_$version"_source.zip
          (cd dist && sha256sum *.exe *.zip > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: PT-Analytics-Next-windows-x64
          path: dist/*
          if-no-files-found: error
      - name: Publish release
        if: inputs.publish && github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite" >&2; exit 1
          fi
          test -z "$(git ls-remote --tags origin "refs/tags/$tag")"
          gh release create "$tag" dist/*.exe dist/*.zip dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "PT Analytics Next $tag" --notes-file RELEASE_NOTES.md --draft
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
